[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-fasthtml-web-audio"
dynamic = ["version"]
description = "A reusable Web Audio API manager for FastHTML applications with multi-buffer support, parallel decode, and card-stack-compatible playback."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['python-fasthtml', 'cjm-fasthtml-tailwind', 'cjm-fasthtml-daisyui', 'cjm-fasthtml-card-stack', 'cjm-fasthtml-keyboard-navigation', 'cjm-fasthtml-app-core']

[project.urls]
Repository = "https://github.com/cj-mills/cjm-fasthtml-web-audio"
Documentation = "https://cj-mills.github.io/cjm-fasthtml-web-audio"

[project.entry-points.nbdev]
cjm_fasthtml_web_audio = "cjm_fasthtml_web_audio._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "cjm_fasthtml_web_audio.__version__"}

[tool.setuptools.packages.find]
include = ["cjm_fasthtml_web_audio"]

[tool.setuptools.package-data]
"cjm_fasthtml_web_audio" = ["static/*.js", "static/*.js.map", "static/LICENSE.*"]

[tool.nbdev]
